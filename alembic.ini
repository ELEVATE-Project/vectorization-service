# Alembic settings. The database URL comes from the app settings (see migrations/env.py).

[alembic]
script_location = %(here)s/migrations
# Lets migrations import the app package.
prepend_sys_path = .
path_separator = os

# Logging for alembic commands: SQLAlchemy warnings only, alembic progress at INFO.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
