---
- hosts: elevate
  become: yes

  vars:
    project_path: /opt/deployment
    current_path: /opt/deployment/vectorization-service
    uvicorn_port: 9000
    uvicorn_workers: 4

  tasks:
    # OCR system packages: poppler for pdf2image, tesseract for pytesseract.
    # Runs first so a failure never tears down the running deployment.
    - name: Install OCR system packages
      apt:
        name:
          - poppler-utils
          - tesseract-ocr
          - tesseract-ocr-eng
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Verify OCR binaries are on PATH
      shell: command -v {{ item }}
      loop:
        - pdfinfo
        - pdftoppm
        - tesseract
      changed_when: false

    - name: Verify Tesseract English language data
      shell: tesseract --list-langs 2>&1 | grep -qx eng
      changed_when: false

    - name: Read Vault token
      slurp:
        src: "{{ project_path }}/.token"
      register: slurpfile

    - name: Create release path
      set_fact:
        release_path: "{{ project_path }}/releases/{{ lookup('pipe','date +%Y%m%d%H%M%S') }}"

    - name: Create release directory
      file:
        path: "{{ release_path }}"
        state: directory
        mode: "0755"

    - name: Clone repository
      git:
        repo: https://github.com/ELEVATE-Project/vectorization-service.git
        dest: "{{ release_path }}"
        version: "{{ gitBranch }}"
        clone: yes
        update: yes

    - name: Download application secrets
      shell: >
        curl --silent --insecure
        --location
        --request GET "{{ vaultAddress }}vectorization-service"
        --header "X-Vault-Token: {{ slurpfile.content | b64decode | trim }}"
        | jq '.data.data'
        > "{{ release_path }}/data2.json"

    - name: Remove current deployment
      file:
        path: "{{ current_path }}"
        state: absent

    - name: Create deployment directory
      file:
        path: "{{ current_path }}"
        state: directory
        mode: "0755"

    - name: Move release into deployment directory
      shell: mv {{ release_path }}/* {{ current_path }}/

    - name: Make json2env executable
      file:
        path: "{{ current_path }}/deployment/json2env.sh"
        mode: "0744"

    - name: Generate .env
      shell: >
        cat {{ current_path }}/data2.json |
        {{ current_path }}/deployment/json2env.sh
        > {{ current_path }}/.env

    - name: Create Python virtual environment
      command: uv venv
      args:
        chdir: "{{ current_path }}"
        creates: "{{ current_path }}/.venv"

    - name: Install dependencies
      shell: uv pip install -r requirements.txt
      args:
        chdir: "{{ current_path }}"
        
    - name: Download spaCy model (en_core_web_sm)
      command: .venv/bin/python -m spacy download en_core_web_sm
      args:
        chdir: "{{ current_path }}"
        
    - name: Create logs directory
      file:
        path: "{{ current_path }}/logs"
        state: directory
        mode: "0755"

    - name: Run Django migrations
      shell: |
        export $(cat .env | xargs)
      args:
        executable: /bin/bash
        chdir: "{{ current_path }}"
      register: migrate_result
      retries: 5
      delay: 10
      until: migrate_result.rc == 0

    - name: Install Uvicorn service
      template:
        src: templates/vectorization-service-uvicorn.j2
        dest: /etc/systemd/system/vectorization-service-uvicorn.service
        mode: "0644"
      notify:
        - Reload systemd

    - meta: flush_handlers

    - name: Enable Uvicorn
      systemd:
        name: vectorization-service-uvicorn
        enabled: yes

    - name: Restart Uvicorn
      systemd:
        name: vectorization-service-uvicorn
        state: restarted

    - name: Check Uvicorn status
      command: systemctl is-active vectorization-service-uvicorn
      register: uvicorn_status
      ignore_errors: true
      changed_when: false
    
    - name: Dump recent Uvicorn logs if not active
      command: journalctl -u vectorization-service-uvicorn -n 50 --no-pager
      when: uvicorn_status is defined and uvicorn_status.stdout != "active"


  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes
